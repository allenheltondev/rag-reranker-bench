# A local database to run the benchmark against.
#
# IMPORTANT: the image tag decides which database version you get, and the in-database
# reranking this benchmark measures needs a release that supports loading an ONNX reranking
# model. Check the tag against Oracle's container registry listing before trusting a result,
# and record the version you actually ran - `npm run bench` puts it in the report for you.
#
#   docker compose up -d
#   docker compose logs -f oracle     # wait for "DATABASE IS READY TO USE!"
#
# Then create the benchmark user and the ONNX_DIR directory object, from the repo root:
#   npm run bootstrap

services:
  oracle:
    image: container-registry.oracle.com/database/free:latest
    container_name: rag-reranker-bench-db
    ports:
      - "1521:1521"
    # Loading an ONNX model allocates it in the MGA, which comes from the container's shared
    # memory. Docker's default /dev/shm is 64 MB; a cross-encoder needs more than a gigabyte,
    # and the failure is an opaque ORA-54466 / ORA-27300 "Cannot allocate memory" rather than
    # anything naming shared memory.
    shm_size: 4gb
    environment:
      ORACLE_PWD: ${ORACLE_SYS_PASSWORD:-ChangeMe_1}
      # Reranking a candidate pool is CPU-bound and memory-hungry; the defaults are too small.
      # Each session that runs PREDICTION holds the model in its PGA, so the aggregate target
      # has to exceed the model size with room to work - a 1.1 GB cross-encoder against a 1 GB
      # target fails with ORA-04036 on the first scoring call. Keep ORACLE_POOL_MAX small for
      # the same reason: every pooled session that scores is another copy.
      INIT_SGA_SIZE: 2048
      INIT_PGA_SIZE: 4096
    volumes:
      - oracle-data:/opt/oracle/oradata
      # Put the exported ONNX models here so DBMS_VECTOR.LOAD_ONNX_MODEL can read them.
      - ./models/oracle:/opt/oracle/onnx
    healthcheck:
      test: ["CMD", "sqlplus", "-L", "sys/${ORACLE_SYS_PASSWORD:-ChangeMe_1}@//localhost:1521/FREEPDB1", "as", "sysdba", "@/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

volumes:
  oracle-data:
